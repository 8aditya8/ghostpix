<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaClean — Image Metadata & AI Tag Stripper</title>
  <meta name="description" content="Strip image metadata in the browser.">
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Geist", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: oklch(0.975 0.002 255);
      --panel: oklch(0.99 0.002 255);
      --fg: oklch(0.19 0.006 255);
      --muted: oklch(0.56 0.01 255);
      --line: oklch(0.89 0.004 255);
      --line-strong: oklch(0.8 0.006 255);
      --accent: oklch(0.18 0.006 255);
      --accent-ink: oklch(0.985 0.001 255);
      --error: oklch(0.58 0.2 26);
      --shadow: 0 24px 60px -36px oklch(0.15 0.008 255 / 0.22);
      --radius: 28px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.145 0.006 255);
        --panel: oklch(0.175 0.006 255);
        --fg: oklch(0.96 0.002 255);
        --muted: oklch(0.7 0.01 255);
        --line: oklch(0.28 0.006 255);
        --line-strong: oklch(0.38 0.008 255);
        --accent: oklch(0.95 0.002 255);
        --accent-ink: oklch(0.14 0.006 255);
        --shadow: 0 24px 60px -36px rgba(0, 0, 0, 0.55);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
    }

    .stage {
      min-height: 100vh;
      padding: 16px;
      display: flex;
    }

    .dropzone {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel), color-mix(in oklab, var(--panel) 92%, var(--bg)));
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      padding: 28px;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
      outline: none;
    }

    .dropzone[data-state="idle"],
    .dropzone[data-state="ready"],
    .dropzone[data-state="error"] {
      cursor: pointer;
    }

    .dropzone[data-state="processing"] {
      cursor: progress;
    }

    .dropzone[data-active="true"] {
      border-color: var(--line-strong);
      transform: scale(0.998);
      box-shadow: 0 20px 56px -36px oklch(0.15 0.008 255 / 0.3);
    }

    .dropzone:focus-visible {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--fg) 12%, transparent), var(--shadow);
    }

    .shell {
      width: min(100%, 520px);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: 22px;
      text-align: center;
    }

    .dropzone[data-state="ready"] .shell {
      width: min(100%, 560px);
      height: 100%;
      max-height: 100%;
      min-height: 0;
      align-self: stretch;
      justify-self: center;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      align-content: stretch;
    }

    .mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      background: color-mix(in oklab, var(--panel) 94%, var(--bg));
    }

    .mark svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid color-mix(in oklab, var(--muted) 35%, transparent);
      border-top-color: var(--fg);
      animation: spin 0.9s linear infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: -0.08em;
      font-weight: 700;
      text-wrap: balance;
    }

    .subtle {
      min-height: 1.25rem;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .summary {
      width: min(100%, 420px);
      display: grid;
      gap: 10px;
      text-align: left;
      min-height: 0;
    }

    .summary[hidden] {
      display: none;
    }

    .dropzone[data-state="ready"] .summary {
      align-self: stretch;
      overflow: auto;
      overscroll-behavior: contain;
      padding-bottom: 2px;
      scrollbar-gutter: stable;
    }

    .filename {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-word;
      text-align: center;
    }

    .metadata {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .metadata-row {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      align-items: start;
    }

    .metadata dt {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .metadata dd {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .metadata-empty {
      padding: 14px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
      text-align: center;
    }

    .actions {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .actions[hidden] {
      display: none;
    }

    .button {
      appearance: none;
      border: none;
      border-radius: 999px;
      min-height: 48px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      transition: transform 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .error {
      color: var(--error);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .stage {
        padding: 12px;
      }

      .dropzone {
        padding: 24px;
        border-radius: 22px;
      }

      .metadata-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0ms !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="dropzone" id="dropzone" data-active="false" data-state="idle" tabindex="0" aria-live="polite">
      <div class="shell">
        <div class="mark" id="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V6"/>
            <path d="m8.5 9.5 3.5-3.5 3.5 3.5"/>
            <path d="M5.5 18h13"/>
          </svg>
        </div>

        <div>
          <h1 id="title">Drop image</h1>
          <p class="subtle" id="subtle">or click anywhere</p>
        </div>

        <div class="actions" id="actions" hidden>
          <a class="button" id="downloadButton" download>Download clean image</a>
        </div>

        <section class="summary" id="summary" hidden>
          <div class="filename" id="filename"></div>
          <dl class="metadata" id="metadataList"></dl>
          <div class="metadata-empty" id="metadataEmpty" hidden>No removable metadata found.</div>
        </section>

        <label class="sr-only" for="fileInput">Choose an image</label>
        <input class="sr-only" id="fileInput" type="file" accept="image/*">
      </div>
    </section>
  </main>

  <script type="module">
    import { stripImageMetadata } from "./metaclean.js";

    const elements = {
      dropzone: document.getElementById("dropzone"),
      mark: document.getElementById("mark"),
      title: document.getElementById("title"),
      subtle: document.getElementById("subtle"),
      summary: document.getElementById("summary"),
      filename: document.getElementById("filename"),
      metadataList: document.getElementById("metadataList"),
      metadataEmpty: document.getElementById("metadataEmpty"),
      actions: document.getElementById("actions"),
      downloadButton: document.getElementById("downloadButton"),
      fileInput: document.getElementById("fileInput"),
    };

    const state = {
      downloadUrl: null,
      runId: 0,
      mode: "idle",
    };

    const utf8Decoder = new TextDecoder("utf-8");
    const latin1Decoder = new TextDecoder("latin1");
    const utf16Decoder = new TextDecoder("utf-16le");
    const labelOrder = [
      "Title",
      "Headline",
      "Description",
      "Subject",
      "Keywords",
      "Camera",
      "Camera Make",
      "Camera Model",
      "Captured",
      "Modified",
      "GPS",
      "Lens",
      "Focal Length",
      "ISO",
      "Exposure",
      "Aperture",
      "Flash",
      "White Balance",
      "Metering",
      "Color Space",

      "Artist",
      "Byline",
      "Byline Title",
      "Credit",
      "Source",
      "Instructions",
      "Copyright",
      "Comment",
      "Orientation",
      "Resolution",
      "Profile",
      "Other metadata",
    ];
    const pngIgnoredAncillaryChunks = new Set([
      "acTL",
      "fcTL",

      "bKGD",
      "cHRM",
      "gAMA",
      "hIST",
      "oFFs",

    const webpIgnoredChunks = new Set([
      "ALPH",

      "VP8X",
    ]);
    const xmpLabelAliases = {
      title: "Title",
      description: "Description",
      creator: "Artist",
      creatortool: "Software",
      createdate: "Captured",
      datetimeoriginal: "Captured",
      datecreated: "Captured",

      metadatadate: "Modified",
      rights: "Copyright",
      rightsstatement: "Copyright",
      copyright: "Copyright",
      subject: "Keywords",
      headline: "Headline",
      instructions: "Instructions",
      credit: "Credit",
      source: "Source",
      creatorjobtitle: "Byline Title",
      authorsposition: "Byline Title",
      byline: "Byline",
      personinimage: "Subject",
      personinimagewdetails: "Subject",
      webstatement: "Source",
      digitalsourcefiletype: "Source",
      city: "City",
      state: "State",
      country: "Country",
      location: "Location",
      rightsusageterms: "Copyright",
      usageterms: "Copyright",
      dcformat: "Format",
      identifier: "Identifier",
      label: "Label",
      rating: "Rating",
    };
    const iptcDatasetDefinitions = {
      "2:5": "Title",
      "2:10": "Urgency",
      "2:15": "Category",
      "2:20": "Supplemental Category",
      "2:25": "Keywords",
      "2:40": "Instructions",
      "2:55": "Captured",
      "2:60": "Captured",
      "2:80": "Byline",
      "2:85": "Byline Title",
      "2:90": "City",
      "2:95": "State",
      "2:100": "Country Code",
      "2:101": "Country",
      "2:103": "Job Identifier",
      "2:105": "Headline",
      "2:110": "Credit",
      "2:115": "Source",
      "2:116": "Copyright",
      "2:118": "Contact",
      "2:120": "Description",
      "2:122": "Writer",
    };
    const exifTagDefinitions = {
      0x010D: { label: "Document" },
      0x010E: { label: "Description" },
      0x010F: { label: "Camera Make" },
      0x0110: { label: "Camera Model" },
      0x0112: { label: "Orientation", format: formatOrientation },
      0x011A: { label: "X Resolution", format: formatNumber },
      0x011B: { label: "Y Resolution", format: formatNumber },
      0x0128: { label: "Resolution Unit", format: (value) => ({ 2: "Inch", 3: "Centimeter" }[firstValue(value)] || String(firstValue(value))) },
      0x0131: { label: "Software" },
      0x0132: { label: "Modified", format: formatExifDate },
      0x013B: { label: "Artist" },
      0x013C: { label: "Host Computer" },
      0x8298: { label: "Copyright" },
      0x829A: { label: "Exposure", format: formatExposure },
      0x829D: { label: "Aperture", format: formatAperture },
      0x8822: { label: "Exposure Program", format: formatEnum({
        0: "Not defined",
        1: "Manual",
        2: "Program",
        3: "Aperture priority",
        4: "Shutter priority",
        5: "Creative",
        6: "Action",
        7: "Portrait",
        8: "Landscape",
      }) },
      0x8827: { label: "ISO", format: (value) => String(firstValue(value)) },
      0x9000: { label: "EXIF Version", format: formatAsciiBytes },
      0x9003: { label: "Captured", format: formatExifDate },
      0x9004: { label: "Created", format: formatExifDate },
      0x9010: { label: "Offset Time", format: cleanText },
      0x9011: { label: "Offset Time Original", format: cleanText },
      0x9012: { label: "Offset Time Digitized", format: cleanText },
      0x9201: { label: "Shutter Speed", format: (value) => formatNumber(value, 2) },
      0x9202: { label: "Aperture", format: formatAperture },
      0x9203: { label: "Brightness", format: (value) => formatNumber(value, 2) },
      0x9204: { label: "Exposure Bias", format: (value) => formatNumber(value, 2) },
      0x9207: { label: "Metering", format: formatEnum({
        0: "Unknown",
        1: "Average",
        2: "Center weighted",
        3: "Spot",
        4: "Multi spot",
        5: "Pattern",
        6: "Partial",
      }) },
      0x9208: { label: "Light Source", format: (value) => String(firstValue(value)) },
      0x9209: { label: "Flash", format: formatFlash },
      0x920A: { label: "Focal Length", format: (value) => `${formatNumber(value, 1).replace(/\.0$/, "")}mm` },
      0x927C: { label: "Maker Notes", format: formatPresence },
      0x9286: { label: "Comment", format: formatExifUserComment },
      0xA001: { label: "Color Space", format: formatEnum({
        1: "sRGB",
        0xFFFF: "Uncalibrated",
      }) },
      0xA002: { label: "Width", format: (value) => `${firstValue(value)} px` },
      0xA003: { label: "Height", format: (value) => `${firstValue(value)} px` },
      0xA20E: { label: "Focal Plane X Resolution", format: formatNumber },
      0xA20F: { label: "Focal Plane Y Resolution", format: formatNumber },
      0xA210: { label: "Focal Plane Resolution Unit", format: (value) => String(firstValue(value)) },
      0xA217: { label: "Sensing Method", format: (value) => String(firstValue(value)) },
      0xA300: { label: "File Source", format: formatAsciiBytes },
      0xA301: { label: "Scene Type", format: formatAsciiBytes },
      0xA402: { label: "Exposure Mode", format: formatEnum({ 0: "Auto", 1: "Manual", 2: "Auto bracket" }) },
      0xA403: { label: "White Balance", format: formatEnum({ 0: "Auto", 1: "Manual" }) },
      0xA404: { label: "Digital Zoom", format: formatNumber },
      0xA405: { label: "Focal Length 35mm", format: (value) => `${firstValue(value)}mm` },
      0xA406: { label: "Scene Capture", format: formatEnum({ 0: "Standard", 1: "Landscape", 2: "Portrait", 3: "Night" }) },
      0xA420: { label: "Image Unique ID" },
      0xA430: { label: "Owner" },
      0xA431: { label: "Camera Serial" },
      0xA432: { label: "Lens Info", format: formatArrayNumbers },
      0xA433: { label: "Lens Make" },
      0xA434: { label: "Lens" },
      0xA435: { label: "Lens Serial" },
      0x9C9B: { label: "Title", format: formatUtf16Bytes },
      0x9C9C: { label: "Comment", format: formatUtf16Bytes },
      0x9C9D: { label: "Artist", format: formatUtf16Bytes },
      0x9C9E: { label: "Keywords", format: formatUtf16Bytes },
      0x9C9F: { label: "Subject", format: formatUtf16Bytes },
    };
    const gpsTagDefinitions = {
      0x0000: { label: "GPS Version", format: formatGpsVersion },
      0x0001: { label: "Latitude Ref" },
      0x0002: { label: "Latitude", format: formatGpsCoordinate },
      0x0003: { label: "Longitude Ref" },
      0x0004: { label: "Longitude", format: formatGpsCoordinate },
      0x0005: { label: "Altitude Ref", format: (value) => (firstValue(value) ? "Below sea level" : "Above sea level") },
      0x0006: { label: "Altitude", format: (value) => `${formatNumber(value, 2)} m` },
      0x0007: { label: "GPS Time", format: formatGpsTime },
      0x0012: { label: "Map Datum" },
      0x001D: { label: "GPS Date", format: cleanText },
    };

    function cleanText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function shorten(value, max = 120) {
      const text = cleanText(value);
      if (text.length <= max) {
        return text;
      }
      return `${text.slice(0, max - 1).trimEnd()}…`;
    }

    function addField(bucket, label, value) {
      const normalized = shorten(value);
      if (!label || !normalized) {
        return;
      }

      if (!bucket.has(label)) {
        bucket.set(label, new Set());
      }

      bucket.get(label).add(normalized);
    }

    function bucketValueCount(bucket) {
      let count = 0;
      for (const values of bucket.values()) {
        count += values.size;
      }
      return count;
    }

    function addPresenceFallback(bucket, beforeCount, label, value = "Present") {
      if (bucketValueCount(bucket) === beforeCount) {
        addField(bucket, label, value);
      }
    }

    function addOtherMetadata(bucket, value) {
      addField(bucket, "Other metadata", value);
    }

    function isPngAncillaryChunk(type) {
      return typeof type === "string" && type.length === 4 && (type.charCodeAt(0) & 32) === 32;
    }

    function extractPrintableStrings(bytes, minimum = 4) {
      const strings = [];
      let start = -1;

      for (let index = 0; index <= bytes.length; index += 1) {
        const byte = index < bytes.length ? bytes[index] : 0;
        const printable = byte >= 32 && byte <= 126;

        if (printable) {
          if (start === -1) {
            start = index;
          }
          continue;
        }

        if (start !== -1 && index - start >= minimum) {
          strings.push(latin1Decoder.decode(bytes.subarray(start, index)));
        }
        start = -1;
      }

      return strings;
    }

    function readAscii(bytes, start, length) {
      const end = Math.min(bytes.length, start + length);
      let result = "";
      for (let index = start; index < end; index += 1) {
        result += String.fromCharCode(bytes[index]);
      }
      return result;
    }

    function humanizeKeyword(keyword) {
      return cleanText(keyword)
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, (match) => match.toUpperCase());
    }

    function normalizeFieldLabel(label) {
      return cleanText(label);
    }

    function firstValue(value) {
      return Array.isArray(value) ? value[0] : value;
    }

    function formatNumber(value, digits = 2) {
      const number = Number(firstValue(value));
      if (!Number.isFinite(number)) {
        return "";
      }
      return number.toFixed(digits).replace(/\.0+$/, "").replace(/(\.\d*[1-9])0+$/, "$1");
    }

    function formatArrayNumbers(value) {
      if (!Array.isArray(value)) {
        return formatNumber(value);
      }
      return value
        .map((item) => formatNumber(item, 2))
        .filter(Boolean)
        .join(", ");
    }

    function formatPresence(value) {
      if (value instanceof Uint8Array) {
        return value.length ? `${value.length} bytes` : "";
      }
      return cleanText(value) ? "Present" : "";
    }

    function formatAsciiBytes(value) {
      if (!(value instanceof Uint8Array)) {
        return cleanText(value);
      }
      return cleanText(latin1Decoder.decode(value).replace(/\0+$/g, ""));
    }

    function formatUtf16Bytes(value) {
      if (!(value instanceof Uint8Array)) {
        return cleanText(value);
      }
      return cleanText(utf16Decoder.decode(value).replace(/\0+$/g, ""));
    }

    function formatExifUserComment(value) {
      if (!(value instanceof Uint8Array)) {
        return cleanText(value);
      }

      if (value.length >= 8) {
        const prefix = readAscii(value, 0, 8);
        const body = value.subarray(8);
        if (prefix.startsWith("ASCII")) {
          return cleanText(latin1Decoder.decode(body).replace(/\0+$/g, ""));
        }
        if (prefix.startsWith("UNICODE")) {
          return cleanText(utf16Decoder.decode(body).replace(/\0+$/g, ""));
        }
      }

      return formatAsciiBytes(value);
    }

    function formatExposure(value) {
      const number = Number(firstValue(value));
      if (!Number.isFinite(number) || number <= 0) {
        return "";
      }
      if (number >= 1) {
        return `${formatNumber(number, 2)} s`;
      }
      const denominator = Math.round(1 / number);
      if (denominator > 1) {
        return `1/${denominator} s`;
      }
      return `${formatNumber(number, 3)} s`;
    }

    function formatAperture(value) {
      const number = Number(firstValue(value));
      if (!Number.isFinite(number) || number <= 0) {
        return "";
      }
      return `f/${formatNumber(number, 1)}`;
    }

    function formatEnum(map) {
      return (value) => {
        const key = Number(firstValue(value));
        return map[key] || (Number.isFinite(key) ? String(key) : "");
      };
    }

    function formatFlash(value) {
      const number = Number(firstValue(value));
      if (!Number.isFinite(number)) {
        return "";
      }
      return number & 1 ? "Fired" : "Did not fire";
    }

    function formatGpsVersion(value) {
      if (!Array.isArray(value)) {
        return "";
      }
      return value.join(".");
    }

    function formatGpsCoordinate(value) {
      if (!Array.isArray(value) || value.length < 3) {
        return "";
      }
      return value.map((part) => formatNumber(part, 5)).filter(Boolean).join(", ");
    }

    function formatGpsTime(value) {
      if (!Array.isArray(value) || value.length < 3) {
        return "";
      }
      return value
        .slice(0, 3)
        .map((part) => formatNumber(part, 0).padStart(2, "0"))
        .join(":");
    }

    async function inflateBytes(bytes) {
      if (typeof DecompressionStream !== "function") {
        return null;
      }

      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      } catch (error) {
        return null;
      }
    }

    function formatExifDate(value) {
      const text = cleanText(value);
      if (!text) {
        return "";
      }
      return text.replace(/^(\d{4}):(\d{2}):(\d{2})/, "$1-$2-$3");
    }

    function formatOrientation(value) {
      const map = {
        1: "Normal",
        2: "Mirrored",
        3: "Upside down",
        4: "Upside down mirrored",
        5: "Rotated left mirrored",
        6: "Rotated right",
        7: "Rotated right mirrored",
        8: "Rotated left",
      };
      return map[value] || String(value);
    }

    function dmsToDecimal(values, ref) {
      if (!Array.isArray(values) || values.length < 3) {
        return "";
      }

      const [degrees, minutes, seconds] = values;
      if (![degrees, minutes, seconds].every((part) => Number.isFinite(part))) {
        return "";
      }

      let decimal = degrees + (minutes / 60) + (seconds / 3600);
      if (ref === "S" || ref === "W") {
        decimal *= -1;
      }
      return decimal.toFixed(5);
    }

    function getXmpLabel(localName) {
      const key = cleanText(localName).toLowerCase();
      return xmpLabelAliases[key] || humanizeKeyword(localName);
    }

    function collectXmpValue(bucket, label, value) {
      const normalizedLabel = normalizeFieldLabel(label);
      const text = cleanText(value);
      if (!normalizedLabel || !text) {
        return;
      }

      if (normalizedLabel === "Captured" || normalizedLabel === "Modified" || normalizedLabel === "Created") {
        addField(bucket, normalizedLabel, formatExifDate(text));
        return;
      }

      addField(bucket, normalizedLabel, text);
    }

    function parseXmpMetadata(text, bucket) {
      const xml = cleanText(text);
      if (!xml) {
        return;
      }

      try {
        const doc = new DOMParser().parseFromString(xml, "application/xml");
        if (doc.querySelector("parsererror")) {
          return;
        }

        const structural = new Set(["rdf", "description", "bag", "seq", "alt", "li"]);
        const ignoredAttributes = new Set(["about", "parseType", "resource", "nodeID", "lang"]);

        function walk(node, inheritedLabel = "") {
          if (!(node instanceof Element)) {
            return;
          }

          const localName = node.localName || "";
          const nextLabel = structural.has(localName.toLowerCase()) ? inheritedLabel : getXmpLabel(localName);

          for (const attribute of Array.from(node.attributes)) {
            if (attribute.name.startsWith("xmlns")) {
              continue;
            }
            if (ignoredAttributes.has(attribute.localName)) {
              continue;
            }
            const attributeLabel = getXmpLabel(attribute.localName);
            collectXmpValue(bucket, attributeLabel, attribute.value);
          }

          const elementChildren = Array.from(node.children);
          const directText = cleanText(Array.from(node.childNodes)
            .filter((child) => child.nodeType === Node.TEXT_NODE || child.nodeType === Node.CDATA_SECTION_NODE)
            .map((child) => child.textContent)
            .join(" "));

          if (directText && nextLabel) {
            collectXmpValue(bucket, nextLabel, directText);
          }

          if (!elementChildren.length && !directText) {
            const fallback = cleanText(node.textContent);
            if (fallback && nextLabel) {
              collectXmpValue(bucket, nextLabel, fallback);
            }
          }

          for (const child of elementChildren) {
            walk(child, nextLabel || inheritedLabel);
          }
        }

        walk(doc.documentElement);
      } catch (error) {
      }
    }

    function getExifTagDefinition(tag, kind) {
      if (kind === "gps") {
        return gpsTagDefinitions[tag] || null;
      }
      return exifTagDefinitions[tag] || null;
    }

    function formatUnknownExifValue(value) {
      if (typeof value === "string") {
        return cleanText(value);
      }
      if (typeof value === "number") {
        return formatNumber(value, 3);
      }
      if (Array.isArray(value) && value.length && value.length <= 8) {
        return value.map((item) => formatNumber(item, 3)).filter(Boolean).join(", ");
      }
      return "";
    }

    function parseExifPayload(bytes, bucket) {
      let offset = 0;
      if (readAscii(bytes, 0, 6) === "Exif\0\0") {
        offset = 6;
      }

      if (bytes.length - offset < 8) {
        return;
      }

      const view = new DataView(bytes.buffer, bytes.byteOffset + offset, bytes.byteLength - offset);
      const order = readAscii(bytes.subarray(offset, offset + 2), 0, 2);
      if (order !== "II" && order !== "MM") {
        return;
      }

      const little = order === "II";
      const typeSizes = {
        1: 1,
        2: 1,
        3: 2,
        4: 4,
        5: 8,
        7: 1,
        9: 4,
        10: 8,
      };

      const getUint16 = (position) => view.getUint16(position, little);
      const getUint32 = (position) => view.getUint32(position, little);
      const getInt32 = (position) => view.getInt32(position, little);

      if (getUint16(2) !== 42) {
        return;
      }

      const context = {};
      const visited = new Set();

      function readValue(type, count, valueOffset) {
        const typeSize = typeSizes[type];
        if (!typeSize || !count) {
          return null;
        }

        const totalSize = typeSize * count;
        let dataOffset = valueOffset;

        if (totalSize > 4) {
          dataOffset = getUint32(valueOffset);
        }

        if (dataOffset < 0 || dataOffset + totalSize > view.byteLength) {
          return null;
        }

        const readRational = (position, signed) => {
          const numerator = signed ? getInt32(position) : getUint32(position);
          const denominator = signed ? getInt32(position + 4) : getUint32(position + 4);
          if (!denominator) {
            return null;
          }
          return numerator / denominator;
        };

        if (type === 1 || type === 7) {
          return new Uint8Array(view.buffer, view.byteOffset + dataOffset, count);
        }

        if (type === 2) {
          return cleanText(latin1Decoder.decode(new Uint8Array(view.buffer, view.byteOffset + dataOffset, count)).replace(/\0+$/g, ""));
        }

        if (type === 3) {
          if (count === 1) {
            return getUint16(dataOffset);
          }
          return Array.from({ length: count }, (_, index) => getUint16(dataOffset + (index * 2)));
        }

        if (type === 4) {
          if (count === 1) {
            return getUint32(dataOffset);
          }
          return Array.from({ length: count }, (_, index) => getUint32(dataOffset + (index * 4)));
        }

        if (type === 5) {
          if (count === 1) {
            return readRational(dataOffset, false);
          }
          return Array.from({ length: count }, (_, index) => readRational(dataOffset + (index * 8), false));
        }

        if (type === 9) {
          if (count === 1) {
            return getInt32(dataOffset);
          }
          return Array.from({ length: count }, (_, index) => getInt32(dataOffset + (index * 4)));
        }

        if (type === 10) {
          if (count === 1) {
            return readRational(dataOffset, true);
          }
          return Array.from({ length: count }, (_, index) => readRational(dataOffset + (index * 8), true));
        }

        return null;
      }

      function parseIfd(position, kind) {
        if (!Number.isFinite(position) || position < 0 || position + 2 > view.byteLength) {
          return;
        }

        const visitKey = `${kind}:${position}`;
        if (visited.has(visitKey)) {
          return;
        }
        visited.add(visitKey);

        const count = getUint16(position);
        for (let index = 0; index < count; index += 1) {
          const entry = position + 2 + (index * 12);
          if (entry + 12 > view.byteLength) {
            break;
          }

          const tag = getUint16(entry);
          const type = getUint16(entry + 2);
          const entryCount = getUint32(entry + 4);
          const value = readValue(type, entryCount, entry + 8);

          if (tag === 0x8769) {
            context.exifIfd = value;
            continue;
          }

          if (tag === 0x8825) {
            context.gpsIfd = value;
            continue;
          }

          if (tag === 0xA005) {
            context.interopIfd = value;
            continue;
          }

          if (kind === "gps") {
            if (tag === 0x0001) context.latRef = value;
            if (tag === 0x0002) context.lat = value;
            if (tag === 0x0003) context.lngRef = value;
            if (tag === 0x0004) context.lng = value;
          }

          const definition = getExifTagDefinition(tag, kind);
          if (definition) {
            const formatted = definition.format ? definition.format(value) : cleanText(value);
            addField(bucket, definition.label, formatted);
            continue;
          }

          const fallback = formatUnknownExifValue(value);
          if (fallback) {
            addField(bucket, `EXIF 0x${tag.toString(16).toUpperCase().padStart(4, "0")}`, fallback);
          }
        }

        const nextIfdPointerPosition = position + 2 + (count * 12);
        if (kind === "ifd0" && nextIfdPointerPosition + 4 <= view.byteLength) {
          const nextIfd = getUint32(nextIfdPointerPosition);
          if (nextIfd) {
            parseIfd(nextIfd, "ifd1");
          }
        }
      }

      parseIfd(getUint32(4), "ifd0");

      if (Number.isFinite(context.exifIfd)) {
        parseIfd(context.exifIfd, "exif");
      }

      if (Number.isFinite(context.gpsIfd)) {
        parseIfd(context.gpsIfd, "gps");
      }

      if (Number.isFinite(context.interopIfd)) {
        parseIfd(context.interopIfd, "interop");
      }

      const camera = [cleanText(context.make), cleanText(context.model)]
        .filter(Boolean)
        .filter((value, index, array) => array.indexOf(value) === index)
        .join(" ");
      addField(bucket, "Camera", camera);

      const lat = dmsToDecimal(context.lat, context.latRef);
      const lng = dmsToDecimal(context.lng, context.lngRef);
      if (lat && lng) {
        addField(bucket, "GPS", `${lat}, ${lng}`);
      }
    }

    async function parsePngMetadata(bytes, bucket) {
      if (readAscii(bytes, 0, 8) !== "\x89PNG\r\n\x1a\n") {
        return;
      }

      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let offset = 8;

      while (offset + 8 <= bytes.length) {
        const length = view.getUint32(offset, false);
        const type = readAscii(bytes, offset + 4, 4);
        const dataStart = offset + 8;
        const dataEnd = dataStart + length;

        if (dataEnd + 4 > bytes.length) {
          break;
        }

        const chunk = bytes.subarray(dataStart, dataEnd);

        if (type === "eXIf") {
          const beforeCount = bucketValueCount(bucket);
          parseExifPayload(chunk, bucket);
          addPresenceFallback(bucket, beforeCount, "EXIF");
        } else if (type === "caBX") {
          parseCaBXMetadata(chunk, bucket);
        } else if (type === "iCCP") {
          addField(bucket, "Profile", "ICC profile");
        } else if (type === "tEXt") {
          const separator = chunk.indexOf(0);
          if (separator > -1) {
            const keyword = latin1Decoder.decode(chunk.subarray(0, separator));
            const value = latin1Decoder.decode(chunk.subarray(separator + 1));
            if (cleanText(keyword).toLowerCase() === "xml:com.adobe.xmp") {
              const beforeCount = bucketValueCount(bucket);
              parseXmpMetadata(value, bucket);
              addPresenceFallback(bucket, beforeCount, "XMP");
            } else {
              mapTextMetadata(keyword, value, bucket);
            }
          }
        } else if (type === "zTXt") {
          const separator = chunk.indexOf(0);
          if (separator > -1 && separator + 2 <= chunk.length) {
            const keyword = latin1Decoder.decode(chunk.subarray(0, separator));
            const inflated = await inflateBytes(chunk.subarray(separator + 2));
            const value = inflated ? latin1Decoder.decode(inflated) : "";
            if (cleanText(keyword).toLowerCase() === "xml:com.adobe.xmp") {
              const beforeCount = bucketValueCount(bucket);
              parseXmpMetadata(value, bucket);
              addPresenceFallback(bucket, beforeCount, "XMP");
            } else {
              mapTextMetadata(keyword, value, bucket);
            }
          }
        } else if (type === "iTXt") {
          const first = chunk.indexOf(0);
          if (first > -1 && first + 5 <= chunk.length) {
            const keyword = utf8Decoder.decode(chunk.subarray(0, first));
            const compressionFlag = chunk[first + 1];
            let cursor = first + 3;
            while (cursor < chunk.length && chunk[cursor] !== 0) {
              cursor += 1;
            }
            cursor += 1;
            while (cursor < chunk.length && chunk[cursor] !== 0) {
              cursor += 1;
            }
            cursor += 1;
            let text = "";
            if (compressionFlag === 0) {
              text = utf8Decoder.decode(chunk.subarray(cursor));
            } else {
              const inflated = await inflateBytes(chunk.subarray(cursor));
              text = inflated ? utf8Decoder.decode(inflated) : "";
            }
            if (cleanText(keyword).toLowerCase() === "xml:com.adobe.xmp") {
              const beforeCount = bucketValueCount(bucket);
              parseXmpMetadata(text, bucket);
              addPresenceFallback(bucket, beforeCount, "XMP");
            } else {
              mapTextMetadata(keyword, text, bucket);
            }
          }
        } else if (type === "tIME" && chunk.length === 7) {
          const year = (chunk[0] << 8) + chunk[1];
          const month = String(chunk[2]).padStart(2, "0");
          const day = String(chunk[3]).padStart(2, "0");
          const hour = String(chunk[4]).padStart(2, "0");
          const minute = String(chunk[5]).padStart(2, "0");
          const second = String(chunk[6]).padStart(2, "0");
          addField(bucket, "Modified", `${year}-${month}-${day} ${hour}:${minute}:${second} UTC`);
        } else if (type === "pHYs" && chunk.length >= 9) {
          const x = view.getUint32(dataStart, false);
          const y = view.getUint32(dataStart + 4, false);
          const unit = chunk[8] === 1 ? "pixels per meter" : "unitless";
          addField(bucket, "Resolution", `${x} × ${y} ${unit}`);
        } else if (isPngAncillaryChunk(type) && !pngIgnoredAncillaryChunks.has(type)) {
          addOtherMetadata(bucket, `PNG ${type}`);
        }

        offset = dataEnd + 4;
      }
    }

    function parseWebpMetadata(bytes, bucket) {
      if (readAscii(bytes, 0, 4) !== "RIFF" || readAscii(bytes, 8, 4) !== "WEBP") {
        return;
      }

      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let offset = 12;

      while (offset + 8 <= bytes.length) {
        const type = readAscii(bytes, offset, 4);
        const length = view.getUint32(offset + 4, true);
        const dataStart = offset + 8;
        const dataEnd = dataStart + length;

        if (dataEnd > bytes.length) {
          break;
        }

        const chunk = bytes.subarray(dataStart, dataEnd);

        if (type === "EXIF") {
          const beforeCount = bucketValueCount(bucket);
          parseExifPayload(chunk, bucket);
          addPresenceFallback(bucket, beforeCount, "EXIF");
        } else if (type === "XMP ") {
          const beforeCount = bucketValueCount(bucket);
          parseXmpMetadata(utf8Decoder.decode(chunk), bucket);
          addPresenceFallback(bucket, beforeCount, "XMP");
        } else if (type === "ICCP") {
          addField(bucket, "Profile", "ICC profile");
        } else if (!webpIgnoredChunks.has(type)) {
          addOtherMetadata(bucket, `WebP ${type.trim() || type}`);
        }

        offset = dataEnd + (length % 2);
      }
    }

    function parseJpegMetadata(bytes, bucket) {
      if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) {
        return;
      }

      let offset = 2;
      while (offset + 4 <= bytes.length) {
        if (bytes[offset] !== 0xFF) {
          break;
        }

        const marker = bytes[offset + 1];
        if (marker === 0xDA || marker === 0xD9) {
          break;
        }

        const length = (bytes[offset + 2] << 8) + bytes[offset + 3];
        const dataStart = offset + 4;
        const dataEnd = offset + 2 + length;

        if (dataEnd > bytes.length) {
          break;
        }

        const chunk = bytes.subarray(dataStart, dataEnd);

        if (marker === 0xE1 && readAscii(chunk, 0, 6) === "Exif\0\0") {
          const beforeCount = bucketValueCount(bucket);
          parseExifPayload(chunk, bucket);
          addPresenceFallback(bucket, beforeCount, "EXIF");
        } else if (marker === 0xE1 && readAscii(chunk, 0, 29) === "http://ns.adobe.com/xap/1.0/\0") {
          const beforeCount = bucketValueCount(bucket);
          parseXmpMetadata(utf8Decoder.decode(chunk.subarray(29)), bucket);
          addPresenceFallback(bucket, beforeCount, "XMP");
        } else if (marker === 0xED) {
          const beforeCount = bucketValueCount(bucket);
          parseJpegApp13(chunk, bucket);
          addPresenceFallback(bucket, beforeCount, "IPTC");
        } else if (marker === 0xE2 && readAscii(chunk, 0, 12) === "ICC_PROFILE\0") {
          addField(bucket, "Profile", "ICC profile");
        } else if (marker === 0xFE) {
          addField(bucket, "Comment", latin1Decoder.decode(chunk));
        } else if (marker >= 0xE0 && marker <= 0xEF) {
          const app = marker - 0xE0;
          const isJfif = marker === 0xE0 && (readAscii(chunk, 0, 5) === "JFIF\0" || readAscii(chunk, 0, 5) === "JFXX\0");
          const isAdobe = marker === 0xEE && readAscii(chunk, 0, 6) === "Adobe\0";
          if (!isJfif && !isAdobe) {
            addOtherMetadata(bucket, `JPEG APP${app}`);
          }
        }

        offset = dataEnd;
      }
    }

    function decodePossiblyUtf8(bytes) {
      const utf8 = cleanText(utf8Decoder.decode(bytes));
      if (utf8) {
        return utf8;
      }
      return cleanText(latin1Decoder.decode(bytes));
    }

    function parseIptcData(bytes, bucket) {
      let offset = 0;
      while (offset + 5 <= bytes.length) {
        if (bytes[offset] !== 0x1C) {
          offset += 1;
          continue;
        }

        const record = bytes[offset + 1];
        const dataset = bytes[offset + 2];
        let size = (bytes[offset + 3] << 8) + bytes[offset + 4];
        let headerSize = 5;

        if (bytes[offset + 3] & 0x80) {
          const extendedBytes = bytes[offset + 4] & 0x7F;
          if (offset + 5 + extendedBytes > bytes.length) {
            break;
          }
          size = 0;
          for (let index = 0; index < extendedBytes; index += 1) {
            size = (size << 8) + bytes[offset + 5 + index];
          }
          headerSize += extendedBytes;
        }

        const dataStart = offset + headerSize;
        const dataEnd = dataStart + size;
        if (dataEnd > bytes.length) {
          break;
        }

        const label = iptcDatasetDefinitions[`${record}:${dataset}`];
        if (label) {
          const value = decodePossiblyUtf8(bytes.subarray(dataStart, dataEnd));
          if (label === "Captured") {
            addField(bucket, label, formatExifDate(value));
          } else {
            addField(bucket, label, value);
          }
        }

        offset = dataEnd;
      }
    }

    function parseJpegApp13(bytes, bucket) {
      const header = "Photoshop 3.0\0";
      if (!readAscii(bytes, 0, header.length).startsWith("Photoshop 3.0")) {
        return;
      }

      let offset = header.length;
      while (offset + 12 <= bytes.length) {
        const signature = readAscii(bytes, offset, 4);
        if (signature !== "8BIM") {
          break;
        }

        const resourceId = (bytes[offset + 4] << 8) + bytes[offset + 5];
        const nameLength = bytes[offset + 6];
        let cursor = offset + 7 + nameLength;
        if ((1 + nameLength) % 2 === 1) {
          cursor += 1;
        }
        if (cursor + 4 > bytes.length) {
          break;
        }

        const size = (bytes[cursor] << 24) + (bytes[cursor + 1] << 16) + (bytes[cursor + 2] << 8) + bytes[cursor + 3];
        const dataStart = cursor + 4;
        const dataEnd = dataStart + size;
        if (dataEnd > bytes.length) {
          break;
        }

        const data = bytes.subarray(dataStart, dataEnd);
        if (resourceId === 0x0404) {
          parseIptcData(data, bucket);
        }

        offset = dataEnd + (size % 2);
      }
    }

    function parseCaBXMetadata(bytes, bucket) {
      const strings = extractPrintableStrings(bytes, 4);
      const text = strings.join("\n");

      addField(bucket, "C2PA", "Present");

      const manifestId = text.match(/urn:c2pa:[0-9a-f-]{16,}/i);
      if (manifestId) {
        addField(bucket, "C2PA Manifest", manifestId[0]);
      }

      const instanceId = text.match(/xmp:iid:[0-9a-f-]{16,}/i);
      if (instanceId) {
        addField(bucket, "Instance ID", instanceId[0]);
      }

      const generator = text.match(/OpenAI Media Service API|OpenAI [^\n]{0,80}Service/i);
      if (generator) {
        addField(bucket, "Generator", generator[0]);
      }

      const actionMatches = Array.from(text.matchAll(/c2pa\.(created|converted|opened|edited|cropped|filtered|exported|resized|transcoded)/gi))
        .map((match) => match[1].toLowerCase());
      if (actionMatches.length) {
        const labels = actionMatches.map((action) => action.charAt(0).toUpperCase() + action.slice(1));
        addField(bucket, "Actions", Array.from(new Set(labels)).join(", "));
      }

      const specVersion = text.match(/specVersion.?([0-9]+\.[0-9]+(?:\.[0-9]+)?)/i);
      if (specVersion) {
        addField(bucket, "C2PA Version", specVersion[1]);
      }

      const filenameString = strings.find((value) => /\b[\w.-]+\.(png|jpg|jpeg|webp|avif|heic)\b/i.test(value));
      if (filenameString) {
        const match = filenameString.match(/\b[\w.-]+\.(png|jpg|jpeg|webp|avif|heic)\b/i);
        if (match) {
          addField(bucket, "Title", match[0]);
        }
      }

      if (/c2pa\.claim\.v2/i.test(text)) {
        addField(bucket, "Claim", "Present");
      }

      if (/c2pa\.signature/i.test(text)) {
        addField(bucket, "Signature", "Present");
      }

      if (/c2pa\.certificate-status/i.test(text) || /SSL\.com C2PA/i.test(text)) {
        addField(bucket, "Certificate", "Present");
      }

      if (/OpenAI TSA/i.test(text) || /sigTst/i.test(text) || /tstTokens/i.test(text)) {
        addField(bucket, "Timestamp", "Present");
      }
    }

    function mapTextMetadata(keyword, value, bucket) {
      const key = cleanText(keyword).toLowerCase();
      const text = cleanText(value);
      if (!text) {
        return;
      }

      if (key === "author" || key === "artist") {
        addField(bucket, "Artist", text);
        return;
      }

      if (key === "software" || key === "creator") {
        addField(bucket, "Software", text);
        return;
      }

      if (key === "comment") {
        addField(bucket, "Comment", text);
        return;
      }

      if (key === "description" || key === "parameters" || key === "prompt") {
        addField(bucket, "Description", text);
        return;
      }

      if (key === "creation time" || key === "date:create") {
        addField(bucket, "Captured", formatExifDate(text));
        return;
      }

      addField(bucket, humanizeKeyword(keyword), text);
    }

    async function inspectMetadata(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const bucket = new Map();

      if (bytes.length >= 4 && bytes[0] === 0xFF && bytes[1] === 0xD8) {
        parseJpegMetadata(bytes, bucket);
      } else if (bytes.length >= 12 && readAscii(bytes, 0, 8) === "\x89PNG\r\n\x1a\n") {
        await parsePngMetadata(bytes, bucket);
      } else if (bytes.length >= 12 && readAscii(bytes, 0, 4) === "RIFF" && readAscii(bytes, 8, 4) === "WEBP") {
        parseWebpMetadata(bytes, bucket);
      }

      const entries = Array.from(bucket.entries()).map(([label, values]) => ({
        label,
        value: Array.from(values).join(" · "),
      }));

      entries.sort((left, right) => {
        const leftIndex = labelOrder.indexOf(left.label);
        const rightIndex = labelOrder.indexOf(right.label);
        const priorityDiff = (leftIndex === -1 ? 999 : leftIndex) - (rightIndex === -1 ? 999 : rightIndex);
        return priorityDiff || left.label.localeCompare(right.label);
      });

      return entries;
    }

    function revokeDownload() {
      if (state.downloadUrl) {
        URL.revokeObjectURL(state.downloadUrl);
        state.downloadUrl = null;
      }
    }

    function setMark(mode) {
      if (mode === "processing") {
        elements.mark.innerHTML = '<div class="spinner" aria-hidden="true"></div>';
        return;
      }

      if (mode === "ready") {
        elements.mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12 4 4 8-8"/></svg>';
        return;
      }

      if (mode === "error") {
        elements.mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 16h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
        return;
      }

      elements.mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V6"/><path d="m8.5 9.5 3.5-3.5 3.5 3.5"/><path d="M5.5 18h13"/></svg>';
    }

    function renderMetadata(entries) {
      elements.metadataList.innerHTML = "";
      elements.metadataEmpty.hidden = entries.length > 0;

      for (const entry of entries) {
        const row = document.createElement("div");
        row.className = "metadata-row";

        const term = document.createElement("dt");
        term.textContent = entry.label;

        const description = document.createElement("dd");
        description.textContent = entry.value;

        row.append(term, description);
        elements.metadataList.append(row);
      }
    }

    function setView(mode, options = {}) {
      state.mode = mode;
      elements.dropzone.dataset.state = mode;
      setMark(mode);
      elements.subtle.classList.toggle("error", mode === "error");

      if (mode === "idle") {
        elements.title.textContent = "Drop image";
        elements.subtle.textContent = "or click anywhere";
        elements.summary.hidden = true;
        elements.actions.hidden = true;
        return;
      }

      if (mode === "processing") {
        elements.title.textContent = "Reading metadata";
        elements.subtle.textContent = options.fileName || "";
        elements.summary.hidden = true;
        elements.actions.hidden = true;
        return;
      }

      if (mode === "ready") {
        const fieldCount = options.metadata.length;
        elements.title.textContent = fieldCount ? `${fieldCount} field${fieldCount === 1 ? "" : "s"} found` : "No metadata found";
        elements.subtle.textContent = "click anywhere to replace";
        elements.filename.textContent = options.fileName || "";
        renderMetadata(options.metadata);
        elements.summary.hidden = false;
        elements.actions.hidden = false;
        return;
      }

      elements.title.textContent = "Try another image";
      elements.subtle.textContent = options.message || "Could not process that file.";
      elements.summary.hidden = true;
      elements.actions.hidden = true;
    }

    function resetState() {
      revokeDownload();
      elements.fileInput.value = "";
      elements.downloadButton.removeAttribute("href");
      elements.downloadButton.removeAttribute("download");
      setView("idle");
    }

    async function handleFile(file, runId) {
      resetState();
      setView("processing", { fileName: file.name || "" });
      await new Promise((resolve) => requestAnimationFrame(resolve));

      const [metadata, result] = await Promise.all([
        inspectMetadata(file).catch(() => []),
        stripImageMetadata(file),
      ]);

      if (runId !== state.runId) {
        return;
      }

      state.downloadUrl = URL.createObjectURL(result.blob);
      elements.downloadButton.href = state.downloadUrl;
      elements.downloadButton.download = result.outputName;

      setView("ready", {
        metadata,
        fileName: result.fileInfo,
      });
    }

    function onFiles(files) {
      const [file] = Array.from(files || []);
      if (!file) {
        return;
      }

      const runId = ++state.runId;
      handleFile(file, runId).catch((error) => {
        if (runId !== state.runId) {
          return;
        }
        resetState();
        setView("error", { message: error.message });
      });
    }

    ["dragenter", "dragover"].forEach((eventName) => {
      elements.dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (state.mode !== "processing") {
          elements.dropzone.dataset.active = "true";
        }
      });
    });

    ["dragleave", "dragend", "drop"].forEach((eventName) => {
      elements.dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (eventName !== "drop") {
          elements.dropzone.dataset.active = "false";
          return;
        }

        elements.dropzone.dataset.active = "false";
        onFiles(event.dataTransfer && event.dataTransfer.files);
      });
    });

    elements.dropzone.addEventListener("click", (event) => {
      if (state.mode === "processing") {
        return;
      }
      if (event.target.closest("#downloadButton")) {
        return;
      }
      elements.fileInput.click();
    });

    elements.dropzone.addEventListener("keydown", (event) => {
      if (state.mode === "processing") {
        return;
      }
      if (event.target !== elements.dropzone) {
        return;
      }
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      event.preventDefault();
      elements.fileInput.click();
    });

    elements.fileInput.addEventListener("change", (event) => {
      onFiles(event.target.files);
    });

    window.addEventListener("beforeunload", revokeDownload);

    setView("idle");

    window.stripMetaApp = {
      stripImageMetadata,
      inspectMetadata,
    };
  </script>
</body>
</html>
